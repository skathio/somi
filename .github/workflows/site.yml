# Site workflow — deploys the overview page (site/) and the docs (docs/) to GitHub Pages through
# hashira's pages-site reusable workflow: the page at /somi/, the docs at /somi/docs/.
#
# Two ways in, one definition:
#   - workflow_dispatch : deploy the page on its own, with no npm release (a content fix, a layout
#                         change, a measurement update between releases). Run it on `main`.
#   - workflow_call     : publish.yml calls this after `publish` with `prebuilt: true`, so every
#                         release deploys the page and docs its `site-build` job built and checked
#                         before anything was published.
#
# pages-site.yml does the rest:
#   - check  : refuses any ref but main, before anyone is asked to approve.
#   - scan   : OSV and gitleaks over the commit, before the approval.
#   - gate   : a page-only deploy waits here for the `production` Environment's owner approval,
#              the same single approval a release needs. A run from publish.yml passes
#              `released: true` and skips it, because its `publish` job already holds that
#              approval (pages-site checks this run holds it): one release, one approval, with
#              the page deployed after the package.
#   - build  : installs site/ (install_command), builds the page into site/dist, runs the page's
#              tests (test_command) with their coverage report, adds hashira's site kit in
#              site/dist/_kit, builds the docs from docs/ and .github/pages.json into
#              site/dist/docs, and uploads the Pages artifact. It holds `contents: read` only.
#              Skipped for a prebuilt release run.
#   - deploy : deploys into the `github-pages` Environment; a released run deploys only while its
#              commit holds the highest vX.Y.Z tag.
#
# The same build runs on every pull request in site-check.yml's `site` job, with `deploy: false`, so what
# reaches main has passed the page's tests (its content against the repo: every CHANGELOG release
# on the roadmap, every command, hook and agent shown) and the docs build.
#
# Who can deploy: the `github-pages` Environment's deployment-branch policy allows `main`, and
# pages-site's `check` refuses any other ref, so what goes out is reviewed, merged content.
# No `push` trigger on purpose: a release-prep commit dates a CHANGELOG release before it is
# published, and the page would announce it early. Deploys are always an explicit act.
name: site

on:
  # No inputs: a hand run can never claim `released` or `prebuilt`, so it always builds and waits at
  # pages-site's gate.
  workflow_dispatch:
  workflow_call:
    inputs:
      released:
        description: "true only from publish.yml's `site` job, whose `publish` job already passed the production approval."
        type: boolean
        default: false
      prebuilt:
        description: "true only from publish.yml's `site` job: deploy the `site` artifact its `site-build` job uploaded instead of building again."
        type: boolean
        default: false

# Deny-all baseline; each job grants the minimum it needs.
permissions: {}

jobs:
  pages:
    name: pages
    # pages-site's build job reads the repo; its deploy job publishes to Pages and proves itself
    # with OIDC. A called workflow's jobs get no more than this.
    permissions:
      contents: read   # pages-site build: checkout
      pages: write     # pages-site deploy: deploy-pages
      id-token: write  # pages-site deploy: deploy-pages authenticates via OIDC
    uses: skathio/hashira/.github/workflows/pages-site.yml@v3 # rolling major tag — same ref as ci.yml's, site-check.yml's and publish.yml's hashira pins
    with:
      # `== true` so a hand run, which has neither input, passes false rather than null.
      released: ${{ inputs.released == true }}
      prebuilt: ${{ inputs.prebuilt == true }}
      # The artifact a hand run builds and deploys, and the one publish.yml's `site-build` uploads
      # for a prebuilt release deploy: the two must match.
      artifact_name: site
      # site/ from its lockfile. --ignore-scripts: no dependency lifecycle script runs, and none
      # is needed (the native binaries come from platform packages).
      install_command: 'npm --prefix site ci --ignore-scripts'
      # The page's own build: facts, type check, Vite, check-dist.
      site_build_command: 'npm --prefix site run build'
      site_output: site/dist
      # A red page test stops a page-only deploy too.
      test_command: 'npm --prefix site test'
      coverage_path: site/coverage/lcov.info
