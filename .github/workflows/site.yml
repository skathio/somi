# Site workflow — deploys the overview page (site/) and the docs (docs/) to GitHub Pages through
# hashira's pages-site reusable workflow: the page at /somi/, the docs at /somi/docs/.
#
# Two ways in, one definition:
#   - workflow_dispatch : deploy the page on its own, with no npm release (a content fix, a layout
#                         change, a measurement update between releases). Run it on `main`.
#   - workflow_call     : publish.yml calls this after `publish`, so every release also deploys the
#                         page from the released ref.
#
# pages-site.yml does the rest, in four jobs:
#   - check  : refuses any ref but main, before anyone is asked to approve.
#   - gate   : a page-only deploy waits here for the `production` Environment's owner approval,
#              the same single approval a release needs. A run from publish.yml passes
#              `released: true` and skips it, because its `publish` job already holds that
#              approval: one release, one approval, with the page deployed after the package.
#   - build  : runs `site_build_command` below, which builds the page into site/dist, then adds
#              hashira's site kit in site/dist/_kit and builds the docs from docs/ and
#              .github/pages.json into site/dist/docs, and uploads the Pages artifact. It holds
#              `contents: read` only.
#   - deploy : deploys into the `github-pages` Environment; a released run deploys only while its
#              commit holds the highest vX.Y.Z tag.
#
# The page's own tests (its content against the repo: every CHANGELOG release on the roadmap,
# every command, hook and agent shown) run on every pull request in ci.yml's `site` job, and the
# docs build runs there too, in its `docs` job, so what reaches main has passed both.
#
# Who can deploy: the `github-pages` Environment's deployment-branch policy allows `main`, and
# pages-site's `check` refuses any other ref, so what goes out is reviewed, merged content.
# No `push` trigger on purpose: a release-prep commit dates a CHANGELOG release before it is
# published, and the page would announce it early. Deploys are always an explicit act.
name: site

on:
  # No inputs: a hand run can never claim `released`, so it always waits at pages-site's gate.
  workflow_dispatch:
  workflow_call:
    inputs:
      released:
        description: "true only from publish.yml's `site` job, whose `publish` job already passed the production approval."
        type: boolean
        default: false

# Deny-all baseline; each job grants the minimum it needs.
permissions: {}

jobs:
  pages:
    name: pages
    # pages-site's build job reads the repo; its deploy job publishes to Pages and proves itself
    # with OIDC. A called workflow's jobs get no more than this.
    permissions:
      contents: read   # pages-site build: checkout
      pages: write     # pages-site deploy: deploy-pages
      id-token: write  # pages-site deploy: deploy-pages authenticates via OIDC
    uses: skathio/hashira/.github/workflows/pages-site.yml@v3 # rolling major tag — same ref as ci.yml's and publish.yml's hashira pins
    with:
      # `== true` so a hand run, which has no `released` input, passes false rather than null.
      released: ${{ inputs.released == true }}
      # pages-site runs this from the repo root and installs nothing for the site, so it installs
      # site/ from its lockfile itself. --ignore-scripts: no dependency lifecycle script runs, and
      # none is needed. The page's tests run before its build, so a red test stops a page-only
      # deploy too. The build is the page's own: facts, type check, Vite, check-dist.
      site_build_command: 'npm --prefix site ci --ignore-scripts && npm --prefix site test && npm --prefix site run build'
      site_output: site/dist
