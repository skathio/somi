<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoMi Overview</title>
    <meta name="description" content="SoMi: a small kernel for coding agents on Claude Code and GitHub Copilot CLI.">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#101216">
    <!-- Link previews (chat apps, social). Absolute URLs: a preview fetcher has no base to resolve against. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoMi">
    <meta property="og:title" content="SoMi: bare-first, reviewed when the diff calls for it">
    <meta property="og:description" content="A multi-agent engineering workflow for Claude Code and GitHub Copilot.">
    <meta property="og:url" content="https://skathio.github.io/somi/">
    <meta property="og:image" content="https://skathio.github.io/somi/icon-512.png">
    <meta property="og:image:alt" content="The SoMi icon">
    <meta name="twitter:card" content="summary">
    <!-- hashira's site kit, which the pages build copies into /somi/_kit/ after the Vite build (absent in vite dev):
         the shared tokens, the theme (in <head>, plain, so a stored choice applies before first paint) and <site-nav>. -->
    <link rel="stylesheet" href="/somi/_kit/tokens.css">
    <script src="/somi/_kit/theme.js"></script>
    <script src="/somi/_kit/site-nav.js" defer></script>
    <!-- The kit's accent: somi's red pair, the same as --color-accent in src/index.css (the darker red on light, for contrast). -->
    <style>:root { --site-accent: #b80f0f; --site-accent-dark: #ff4d4d; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
