<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoMi Overview</title>
    <meta name="description" content="SoMi: a multi-agent engineering workflow for Claude Code and GitHub Copilot. Roadmap, workflows, the cost system and the guardrails.">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#101216">
    <!-- Link previews (chat apps, social). Absolute URLs: a preview fetcher has no base to resolve against. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoMi">
    <meta property="og:title" content="SoMi: plan, code, review, with guardrails and a cost cap">
    <meta property="og:description" content="A multi-agent engineering workflow for Claude Code and GitHub Copilot.">
    <meta property="og:url" content="https://skathio.github.io/somi/">
    <meta property="og:image" content="https://skathio.github.io/somi/icon-512.png">
    <meta property="og:image:alt" content="The SoMi icon">
    <meta name="twitter:card" content="summary">
    <script>
      // Set the theme before first paint so a dark-mode viewer never sees a light flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('somi-theme'); } catch (e) { /* storage blocked */ }
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
